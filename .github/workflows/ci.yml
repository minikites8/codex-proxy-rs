name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'release/version.yaml'
      - 'release/notes.md'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      container: ${{ steps.filter.outputs.container }}
      source_container: ${{ steps.filter.outputs.source_container }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect affected checks
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # 目录规则取并集，再统一排除说明文档，保留隐藏配置
          predicate-quantifier: some-with-excludes
          filters: |
            backend:
              - '.github/scripts/toolchains.rb'
              - 'deploy/Dockerfile'
              - 'backend/**'
              - 'release/version.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_quality.yml'
              - '!**/*.md'
            frontend:
              - '.github/scripts/toolchains.rb'
              - 'backend/rust-toolchain.toml'
              - 'deploy/Dockerfile'
              - 'frontend/**'
              - '.github/actions/build-frontend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_quality.yml'
              - '!**/*.md'
            container:
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - '.dockerignore'
              - 'release/version.yaml'
              - '.github/actions/verify-container/**'
              - '.github/actions/build-binary/**'
              - '.github/actions/build-frontend/**'
              - '.github/scripts/toolchains.rb'
              - '.github/scripts/package-release.rb'
              - '.github/scripts/release-metadata.rb'
              - '.github/workflows/_container.yml'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
            source_container:
              - 'deploy/Dockerfile'
              - 'deploy/Dockerfile.dockerignore'
              - '.dockerignore'
              - 'backend/**/Cargo.toml'
              - 'backend/Cargo.lock'
              - 'backend/rust-toolchain.toml'
              - 'backend/**/build.rs'
              - 'backend/.cargo/**'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/.npmrc'
              - 'frontend/patches/**'
              - '.github/workflows/_container.yml'
              - '.github/workflows/ci.yml'

  quality:
    needs: changes
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      run_backend: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
      # 预构建容器复用同一次前端检查产物，源码 Docker 构建仍独立验证
      run_frontend: ${{ needs.changes.outputs.frontend == 'true' && (needs.changes.outputs.container != 'true' || needs.changes.outputs.source_container == 'true') }}

  container:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.container == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_container.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source_build: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.source_container == 'true' }}
      export_image: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

  publish-image:
    needs: [quality, container]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-image-amd64
          path: ${{ runner.temp }}/runtime-image

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified main image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          source="codex-proxy-rs:ci-${GITHUB_SHA}"
          docker load --input "$RUNNER_TEMP/runtime-image/runtime-image.tar"
          docker tag "$source" "$image:sha-${GITHUB_SHA}"
          docker tag "$source" "$image:main"
          docker push "$image:sha-${GITHUB_SHA}"
          docker push "$image:main"
          docker manifest inspect "$image:sha-${GITHUB_SHA}" > /dev/null
          {
            echo '### Published image (linux/amd64)'
            echo
            echo "\`$image:main\`"
            echo
            echo "\`$image:sha-${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
